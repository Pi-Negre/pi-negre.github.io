---
layout: default
title: Categories
---

<h1>Categories</h1>

{% assign sorted_categories = site.categories | sort %}

{% for category in sorted_categories %}
  <h2 id="{{ category[0] }}">{{ category[0] }}</h2>

  <ul>
    {% for post in category[1] %}
      <li>
        <a href="{{ post.url }}">
          {{ post.title }}
        </a>
        <small>({{ post.project-date }})</small>
      </li>
    {% endfor %}
  </ul>
{% endfor %}
